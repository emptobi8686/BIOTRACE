name: Deploy BIOTRACE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e "
            const names = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY'];
            const missing = names.filter((name) => !process.env[name]?.trim());
            if (missing.length) {
              console.error('Missing GitHub repository variables: ' + missing.join(', '));
              process.exit(1);
            }
            const url = new URL(process.env.VITE_SUPABASE_URL);
            if (url.protocol !== 'https:') {
              console.error('VITE_SUPABASE_URL must use HTTPS.');
              process.exit(1);
            }
          "

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
